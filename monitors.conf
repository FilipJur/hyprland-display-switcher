# Cold-boot fallback is in base.conf; the generated profile selects the output.
# The display switcher (Super+O) updates display-switcher-generated.conf.
# The startup reload in userprefs.conf reapplies that saved profile.
# If a saved TV-only profile hides the desktop, run from a Hyprland terminal/TTY:
# ~/.local/bin/display-apply.sh monitor
# Offline recovery: enable the PHL monitor and disable the TV in the generated file.
# NOTE: Do NOT add monitorv2 blocks here — they conflict with the generated
# config's monitorv2 blocks when both target the same output.

# Aquamarine 0.15 always probes the Wayland backend at startup. If another
# compositor is listening on the default socket (wayland-0 — e.g. a Plasma/
# KWin session left logged in on another TTY), Hyprland attaches a phantom
# nested output "WAYLAND-N" at 1280x720 that steals workspace 2.
monitor = WAYLAND-1, disable
monitor = WAYLAND-2, disable
