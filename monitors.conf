# Startup defaults for the two known displays, identified by full EDID
# description so connector renumbering cannot invalidate these rules.
# These explicit monitorv2 blocks keep HyDE's catch-all
# "monitor = ,preferred,auto,auto" from claiming displays in 8-bit SDR.
# display-switcher-generated.conf is sourced after this file and stays the
# later desired-state override written on every mode switch.
monitorv2 {
    output = desc:Philips Consumer Electronics Company PHL 345E2 UK02226037640
    mode = 3440x1440@74.98
    position = 0x0
    scale = 1
    bitdepth = 10
    cm = srgb
    sdr_eotf = srgb
    sdrsaturation = 1.2
    vrr = 0
}
monitorv2 {
    output = desc:Philips Consumer Electronics Company Philips UHDTV 0x01010101
    disabled = true
}
