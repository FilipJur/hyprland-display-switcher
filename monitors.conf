# Monitor definitions - startup defaults managed by display-switcher
# These explicit monitorv2 blocks prevent HyDE's catch-all
# "monitor = ,preferred,auto,auto" from claiming displays in 8-bit SDR.
# Display-switcher-generated.conf overrides at runtime via hyprctl reload.
monitorv2 {
    output = DP-2
    mode = 3440x1440@74.98
    position = 0x0
    scale = 1
    bitdepth = 10
    cm = dcip3
    sdr_eotf = gamma22
}
monitorv2 {
    output = DP-1
    disabled = true
}
